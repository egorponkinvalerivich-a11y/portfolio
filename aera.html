<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AERA — Private Residences</title><body style="margin:0;background:#0b1a12;color:#d5bd7b;font-family:system-ui,sans-serif"><div id="loading" style="min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.16em">LOADING AERA…</div><script type="module">try{const urls=['aera/1.txt','aera/2.txt','aera/3.txt','aera/4.txt','aera/5.txt'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.text()}));const d=parts.join('').trim();const b=Uint8Array.from(atob(d),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('loading').textContent='AERA FAILED TO LOAD';console.error(e)}</script>
