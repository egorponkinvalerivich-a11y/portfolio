<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HALO — Private Retreat</title><body style="margin:0;background:#080a09;color:#c5a978;font-family:system-ui,sans-serif"><div id="loading" style="min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.16em">LOADING HALO…</div><script type="module">try{const urls=['halo/1.txt','halo/2.txt','halo/3.txt','halo/4.txt','halo/5.txt'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.text()}));const d=parts.join('').trim();const b=Uint8Array.from(atob(d),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('loading').textContent='HALO FAILED TO LOAD';console.error(e)}</script>
