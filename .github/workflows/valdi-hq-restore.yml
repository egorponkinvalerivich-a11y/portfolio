name: VALDI HQ restore

on:
  push:
    branches: [valdi-hq-photo-restore-20260822]
    paths:
      - 'valdi_v4_final/assets/img/hq_restore/READY'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild HQ WebP files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re
          src=Path('valdi_v4_final/assets/img/hq_restore')
          dst=Path('valdi_v4_final/assets/img/campaign')
          expected={x.strip() for x in (src/'READY').read_text().splitlines() if x.strip() and not x.startswith('#')}
          groups={}
          for p in src.glob('*.part*'):
              m=re.match(r'(.+\.webp)\.part(\d+)$', p.name)
              if m and m.group(1) in expected:
                  groups.setdefault(m.group(1), []).append((int(m.group(2)),p))
          if set(groups)!=expected:
              raise SystemExit(f'Payload set mismatch: got {sorted(groups)}, expected {sorted(expected)}')
          for name, parts in groups.items():
              b64=''.join(p.read_text().strip() for _,p in sorted(parts))
              data=base64.b64decode(b64, validate=True)
              if len(data) < 25000:
                  raise SystemExit(f'{name} too small: {len(data)}')
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{name} is not WebP')
              (dst/name).write_bytes(data)
              print(name, len(data))
          PY
      - name: Remove consumed transport files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            rm -f valdi_v4_final/assets/img/hq_restore/"$name".part*
          done < valdi_v4_final/assets/img/hq_restore/READY
          rm -f valdi_v4_final/assets/img/hq_restore/READY
      - name: Commit restored images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add valdi_v4_final/assets/img/campaign valdi_v4_final/assets/img/hq_restore
          git commit -m 'Restore VALDI HQ product images [skip ci]'
          git push
