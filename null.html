<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NULL — Onchain Execution Network</title><body style="margin:0;background:#050505;color:#fff;font-family:system-ui,sans-serif"><div id="loading" style="min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.16em">LOADING NULL…</div><script type="module">try{const urls=['null/1.txt','null/2.txt','null/3.txt','null/4.txt','null/5.txt'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.text()}));const d=parts.join('').trim();const b=Uint8Array.from(atob(d),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('loading').textContent='NULL FAILED TO LOAD';console.error(e)}</script>
